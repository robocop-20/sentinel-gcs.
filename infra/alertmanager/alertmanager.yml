route:
  receiver: sentinel-operator-review
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 30m

receivers:
  # Default field profile keeps alerts inside the isolated engineering console.
  # An approved site may replace this receiver with the documented webhook
  # template after authorising external operational-metadata egress.
  - name: sentinel-operator-review

