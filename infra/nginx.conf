events {}

pid /tmp/nginx.pid;

http {
    server_tokens off;
    client_max_body_size 2500k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    proxy_ssl_certificate /run/secrets/gateway-api-client-cert;
    proxy_ssl_certificate_key /run/secrets/gateway-api-client-key;
    proxy_ssl_trusted_certificate /run/secrets/tls-ca;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Correlation-ID $request_id;
    proxy_set_header traceparent $http_traceparent;

    server {
        listen 8080;
        # This port is published on 127.0.0.1 only. It gives the local C:
        # console a certificate-free loopback edge while gateway-to-API stays
        # mutually authenticated TLS on the isolated Docker network.
        proxy_set_header X-Forwarded-Proto http;

        location /ws/ {
            proxy_pass https://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        location = /metrics { return 404; }
        location / {
            proxy_pass https://api:8080;
            proxy_http_version 1.1;
        }
    }

    server {
        listen 8443 ssl;
        ssl_protocols TLSv1.3;
        ssl_certificate /run/secrets/gateway-server-cert;
        ssl_certificate_key /run/secrets/gateway-server-key;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; connect-src 'self' wss:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

        proxy_set_header X-Forwarded-Proto https;

        location /ws/ {
            proxy_pass https://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        # Engineering telemetry is scraped directly on the isolated service
        # network with a dedicated mTLS identity, never via the browser edge.
        location = /metrics { return 404; }

        location / {
            proxy_pass https://api:8080;
            proxy_http_version 1.1;
        }
    }
}
