services:
  trainer:
    image: fpv-vision-gpu
    build:
      context: .
      dockerfile: Dockerfile.vision-gpu
    profiles: ["training"]
    gpus: all
    working_dir: /service
    environment:
      YOLO_CONFIG_DIR: /tmp
    volumes:
      - ./training:/service/training
      - ./models:/models
    entrypoint: ["python"]
